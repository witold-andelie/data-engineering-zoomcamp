version: 2

models:
  - name: stg_trade_events_stream
    description: "Standardized staging model for streamed trade events"
    columns:
      - name: event_time
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: ingestion_mode
        tests:
          - not_null
          - accepted_values:
              values: ['stream', 'batch']
