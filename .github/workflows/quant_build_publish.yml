name: quant-build-publish

on:
  push:
    branches: [ main ]
    paths:
      - 'quant-finance-pipeline/collector/**'
      - 'quant-finance-pipeline/dashboard-streamlit/**'
      - '.github/workflows/quant_build_publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    env:
      GAR_LOCATION: us-central1
      GAR_REPOSITORY: quant-platform
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Build collector image
        run: |
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/collector:${{ github.sha }} \
            quant-finance-pipeline/collector

      - name: Push collector image
        run: docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/collector:${{ github.sha }}

      - name: Build dashboard image
        run: |
          docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/dashboard:${{ github.sha }} \
            quant-finance-pipeline/dashboard-streamlit

      - name: Push dashboard image
        run: docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/dashboard:${{ github.sha }}
